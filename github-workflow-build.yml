name: build

on:
  push:
    branches: [master, main]
  pull_request:

# Two pushes in quick succession must not work out the same version number.
concurrency:
  group: build-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # lets the release step create a release and its tag; nothing else uses it
    env:
      # A push to the main branch is released only when its last commit message contains [release]
      # (any capitalisation). Every other push, and every pull request, is only built and tested.
      IS_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      # The next version is the latest release tag with the minor number raised by one:
      # v1.4.0 -> 1.5.0. With no tag yet it starts at 1.1.0. To change the major number, create a
      # tag by hand (git tag v2.0.0 && git push origin v2.0.0); the next build then releases 2.1.0.
      - name: Next version
        if: env.IS_RELEASE == 'true'
        run: |
          $latest = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
          if ($latest -match '^v(\d+)\.(\d+)\.\d+$') { $version = "$($Matches[1]).$([int]$Matches[2] + 1).0" } else { $version = '1.1.0' }
          Write-Host "Latest tag: '$latest' -> building $version"
          Add-Content $env:GITHUB_ENV "RELEASE_VERSION=$version"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebCrawler.sln

      - name: Build
        run: |
          $extra = @()
          if ($env:RELEASE_VERSION) { $extra += "-p:Version=$env:RELEASE_VERSION" }
          dotnet build WebCrawler.sln --configuration Release --no-restore @extra

      - name: Test
        run: dotnet test WebCrawler.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish WebCrawler/WebCrawler.csproj --configuration Release --no-build --output publish

      - name: Zip
        run: |
          $name = if ($env:RELEASE_VERSION) { "WebCrawler-$env:RELEASE_VERSION-win.zip" } else { "WebCrawler-win.zip" }
          Compress-Archive -Path publish\* -DestinationPath $name
          Add-Content $env:GITHUB_ENV "ZIP_NAME=$name"

      # Builds that are not released keep their zip as a downloadable artifact.
      - uses: actions/upload-artifact@v7
        if: env.IS_RELEASE != 'true'
        with:
          name: WebCrawler
          path: ${{ env.ZIP_NAME }}

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:RELEASE_VERSION" $env:ZIP_NAME --target $env:GITHUB_SHA --title "WebCrawler $env:RELEASE_VERSION" --generate-notes
