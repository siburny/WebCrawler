name: build

on:
  push:
    branches: [master, main]
  pull_request:

# Two pushes in quick succession must not work out the same version number.
concurrency:
  group: build-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  # A push to the main branch is released only when its last commit message contains [release]
  # (any capitalisation). Every other push, and every pull request, is only built and tested.
  IS_RELEASE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release]') }}

jobs:
  # The next version is the latest release tag with the minor number raised by one:
  # v1.4.0 -> 1.5.0. With no tag yet it starts at 1.1.0. To change the major number, create a
  # tag by hand (git tag v2.0.0 && git push origin v2.0.0); the next build then releases 2.1.0.
  # It is worked out once here so that every platform build gets the same number.
  version:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true

      - name: Next version
        id: next
        if: env.IS_RELEASE == 'true'
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            version="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
          else
            version="1.1.0"
          fi
          echo "Latest tag: '$latest' -> building $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: framework-dependent (needs the .NET 10 Runtime), as before.
          - name: win-x64
            os: windows-latest
            rid: win-x64
            self_contained: false
          # macOS: self-contained .app bundles (one for Apple silicon, one for Intel Macs).
          - name: macos-arm64
            os: macos-latest
            rid: osx-arm64
            self_contained: true
          - name: macos-x64
            os: macos-latest
            rid: osx-x64
            self_contained: true
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebCrawler.sln

      - name: Build
        shell: bash
        run: |
          extra=()
          if [ -n "$RELEASE_VERSION" ]; then extra+=("-p:Version=$RELEASE_VERSION"); fi
          dotnet build WebCrawler.sln --configuration Release --no-restore "${extra[@]}"

      # The tests run on this machine's architecture, so the Intel Mac build (which only differs in its
      # publish target) is not tested a second time.
      - name: Test
        if: matrix.name != 'macos-x64'
        run: dotnet test WebCrawler.sln --configuration Release --no-build

      - name: Publish
        shell: bash
        run: |
          extra=()
          if [ -n "$RELEASE_VERSION" ]; then extra+=("-p:Version=$RELEASE_VERSION"); fi
          dotnet publish WebCrawler/WebCrawler.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained ${{ matrix.self_contained }} --output publish "${extra[@]}"

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = if ($env:RELEASE_VERSION) { "WebCrawler-$env:RELEASE_VERSION-win.zip" } else { "WebCrawler-win.zip" }
          Compress-Archive -Path publish\* -DestinationPath $name
          Add-Content $env:GITHUB_ENV "ZIP_NAME=$name"

      # A macOS app is a folder (WebCrawler.app) with the program in Contents/MacOS and an Info.plist next to it.
      # It is signed ad hoc (no developer account): enough to start, but a downloaded copy is still quarantined by
      # Gatekeeper, so the first start needs right-click > Open (see README).
      - name: Create .app and zip (macOS)
        if: runner.os == 'macOS'
        run: |
          version="${RELEASE_VERSION:-1.0.0}"
          app="WebCrawler.app"
          mkdir -p "$app/Contents/MacOS"
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/WebCrawler"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>WebCrawler</string>
            <key>CFBundleDisplayName</key><string>Web Crawler</string>
            <key>CFBundleIdentifier</key><string>com.expeditions.webcrawler</string>
            <key>CFBundleExecutable</key><string>WebCrawler</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          if [ -n "$RELEASE_VERSION" ]; then name="WebCrawler-$RELEASE_VERSION-${{ matrix.name }}.zip"; else name="WebCrawler-${{ matrix.name }}.zip"; fi
          ditto -c -k --sequesterRsrc --keepParent "$app" "$name"
          echo "ZIP_NAME=$name" >> "$GITHUB_ENV"

      # The zips are kept as downloadable build artifacts; the release job below attaches them to a release.
      - uses: actions/upload-artifact@v7
        with:
          name: WebCrawler-${{ matrix.name }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: [version, build]
    if: needs.version.outputs.release_version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the release step create a release and its tag
      actions: read   # lets it download the build artifacts of this run
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
    steps:
      - name: Download the builds
        run: gh run download "$GITHUB_RUN_ID" --dir artifacts --pattern 'WebCrawler-*'

      - name: Publish GitHub release
        run: gh release create "v$RELEASE_VERSION" artifacts/*/*.zip --target "$GITHUB_SHA" --title "WebCrawler $RELEASE_VERSION" --generate-notes
