name: build

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WebCrawler.sln

      - name: Build
        run: dotnet build WebCrawler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WebCrawler.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish WebCrawler/WebCrawler.csproj --configuration Release --no-build --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: WebCrawler
          path: publish